<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Geral - Euroart</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script src="auth.js"></script>
</head>
<body>
    <div class="app-layout">
        <main class="main-content">
            <div class="container">
                <div class="header-with-logo">
                    <img src="images/euro.png" alt="Logo Euroart" class="logo" onerror="this.style.display='none'">
                    <h1>Dashboard de Expedição</h1>
                </div>

                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 24px;">
                    <div style="background: #eff6ff; border: 1px solid #bfdbfe; padding: 20px; border-radius: 8px;">
                        <span style="font-size: 0.85rem; color: #1e40af; font-weight: 600; text-transform: uppercase;">Conferência Ativa</span>
                        <h2 style="color: #1e3a8a; margin-top: 6px;" id="dashConfAtiva">Carregando...</h2>
                    </div>
                    <div style="background: #f0fdf4; border: 1px solid #bbf7d0; padding: 20px; border-radius: 8px;">
                        <span style="font-size: 0.85rem; color: #15803d; font-weight: 600; text-transform: uppercase;">Volumes no Sistema</span>
                        <h2 style="color: #166534; margin-top: 6px;" id="dashTotalPacotes">-</h2>
                    </div>
                </div>

                <div class="controls" style="margin-bottom: 20px;">
                    <button onclick="window.location.href='conferencia.html'" class="btn-finalizar" style="font-size: 1rem; padding: 12px 24px;">
                        <i class="fas fa-play"></i> Ir para Conferência em Execução
                    </button>
                </div>
            </div>

            <footer>
                <div id="versiculo-do-dia"></div>
                <p>&copy; 2026 - PI Euroart - Fatec Indaiatuba</p>
            </footer>
        </main>
    </div>

    <script src="utils.js"></script>
    <script src="menu.js"></script>
    <script>
        if (typeof carregarMenu === 'function') {
            carregarMenu('menu-dashboard');
        }

        async function carregarDadosDash() {
            try {
                const res = await fetch('http://localhost:3000/api/conferencias/ativas', {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });
                const conferencias = await res.json();
                if (Array.isArray(conferencias) && conferencias.length > 0) {
                    document.getElementById('dashConfAtiva').textContent = conferencias[0].transportadora;
                    const total = conferencias.reduce((acc, c) => acc + (c.pacotes ? c.pacotes.length : 0), 0);
                    document.getElementById('dashTotalPacotes').textContent = `${total} pacotes`;
                } else {
                    document.getElementById('dashConfAtiva').textContent = "Nenhuma ativa";
                    document.getElementById('dashTotalPacotes').textContent = "0 pacotes";
                }
            } catch {
                document.getElementById('dashConfAtiva').textContent = "Offline";
            }
        }
        carregarDadosDash();
    </script>
</body>
</html>
